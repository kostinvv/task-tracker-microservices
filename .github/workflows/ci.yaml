name: Tasks-CI-CD

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - 
        name: Checkout
        uses: actions/checkout@v4
      -
        name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_HUB_USER }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}        
      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      -
        name: Build & Push Client Frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ vars.CLIENT_APP_DOCKERFILE_PATH }}
          push: true
          tags: ${{ vars.DOCKER_HUB_USER }}/${{ vars.CLIENT_APP_NAME }}:latest
          build-args: |
            API_URL=${{ vars.API_URL }}
      -
        name: Build & Push Tasks Service 
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ vars.TASKS_SERVICE_DOCKERFILE_PATH }}
          push: true
          tags: ${{ vars.DOCKER_HUB_USER }}/${{ vars.TASKS_SERVICE_NAME }}:latest
      -
        name: Build & Push Email Sender Service
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ vars.EMAILSENDER_SERVICE_DOCKERFILE_PATH }}
          push: true
          tags: ${{ vars.DOCKER_HUB_USER }}/${{ vars.EMAILSENDER_SERVICE_NAME }}:latest
      -
        name: Build & Push Scheduler Service
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ vars.SCHEDULER_SERVICE_DOCKERFILE_PATH }}
          push: true
          tags: ${{ vars.DOCKER_HUB_USER }}/${{ vars.SCHEDULER_SERVICE_NAME }}:latest