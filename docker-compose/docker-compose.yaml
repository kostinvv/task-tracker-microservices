services:
  task-tracker-client:
    image: kostinvv/task-tracker-client:latest
    ports:
      - "80:4173"
    depends_on:
      - task-tracker-tasks
    restart: always

  task-tracker-tasks:
    container_name: task-traker-tasks
    image: kostinvv/task-tracker-tasks:latest
    ports:
      - "8080:8080"
    environment:
        DefaultConnection: "Host=postgres;Port=5432;Database=${PostgresDb};Username=${PostgresUser};Password=${PostgresPassword}"
        ASPNETCORE_ENVIRONMENT: "Development"
    env_file:
      - ./.env
    depends_on:
      postgres:
        condition: service_healthy
      broker-1:
        condition: service_started

  task-tracker-emailsender:
    container_name: task-traker-emailsender
    image: kostinvv/task-tracker-emailsender
    env_file:
      - ./.env.emailsender
    depends_on:
      - broker-1
      - task-tracker-tasks

  task-tracker-scheduler:
    container_name: task-traker-scheduler
    image: kostinvv/task-tracker-scheduler:latest
    environment:
        DefaultConnection: "Host=postgres;Port=5432;Database=${PostgresDb};Username=${PostgresUser};Password=${PostgresPassword}"
    env_file:
      - ./.env.scheduler
    depends_on:
      - broker-1
      - task-tracker-tasks

  postgres:
    image: postgres:18.0
    container_name: postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${PostgresUser:-postgres}
      - POSTGRES_PASSWORD=${PostgresPassword:-postgres}
    volumes:
      - postgres-data:/var/lib/postgresql/18/main
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PostgresUser:-postgres}"]
      interval: 5s
      timeout: 3s
      retries: 10

  broker-1:
    image: apache/kafka:4.0.1
    container_name: broker-1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://broker-1:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@broker-1:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    volumes:
      - broker-1-data:/var/lib/kafka/data

volumes:
  postgres-data:
  broker-1-data: