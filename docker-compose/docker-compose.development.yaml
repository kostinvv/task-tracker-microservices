services:
  task-traker-api:
    container_name: task-traker-api
    build: 
      context: ..
      dockerfile: src/Services/Tasks/TaskTracker.Services.Tasks.Api/Dockerfile
      args: 
        BUILD_CONFIGURATION: Development
    ports:
      - "8080:8080"
    environment: 
      ASPNETCORE_ENVIRONMENT: Development
    env_file:
      - ../.env
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18.0
    container_name: postgres
    restart: unless-stopped
    ports:
      - ${PostgresHostPort:-5452}:${PostgresPort:-5432}
    environment:
      - POSTGRES_USER=${PostgresUser:-postgres}
      - POSTGRES_PASSWORD=${PostgresPassword:-postgres}
    volumes:
      - postgres-data:/var/lib/postgresql/18/main
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PostgresUser:-postgres}"]
      interval: 5s
      timeout: 3s
      retries: 10

  broker-1:
    image: apache/kafka:4.0.1
    container_name: broker-1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,INTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://broker-1:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@broker-1:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    ports:
      - "9092:9092"
    volumes:
      - broker-1-data:/var/lib/kafka/data

  kafka-ui:
    container_name: kafka-ui
    image: provectuslabs/kafka-ui:latest
    ports:
      - "8085:8080"
    depends_on:
      - broker-1
    environment: 
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: broker-1:29092
      DYNAMIC_CONFIG_ENABLED: true

volumes:
  postgres-data:
  broker-1-data: